<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>アン・ギャルド オンライン対戦</title>
  <meta name="description" content="フェンシングをカードで遊ぶ2人用ゲーム「アン・ギャルド」を、ブラウザで友だちと対戦。">
  <meta name="theme-color" content="#EFEBE4">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- ロビー: 映像のタイトル画面のような集中線の背景に、ロゴと2人の剣士 -->
  <section id="screen-lobby" class="screen screen-title" hidden>
    <div class="title-hero">
      <h1 class="logo">EN GARDE</h1>
      <p class="logo-sub">アン・ギャルド <em>オンライン対戦</em></p>
      <div class="title-duel" id="title-duel"></div>
    </div>

    <div class="panel lobby-panel" id="lobby-create">
      <label class="field">
        <span class="field-label">あなたの名前</span>
        <input id="name-input" type="text" maxlength="16" placeholder="例：アリス" autocomplete="nickname" enterkeyhint="done">
      </label>
      <button class="btn btn-primary btn-block" id="create-btn" type="button">部屋を作る</button>
      <div class="or"><span>友だちの部屋に入る</span></div>
      <div class="join-row">
        <input id="room-input" type="text" maxlength="5" placeholder="部屋コード" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="部屋コード">
        <button class="btn btn-secondary" id="join-btn" type="button">参加する</button>
      </div>
      <p class="form-error" id="lobby-error" role="alert" hidden></p>
    </div>

    <div class="panel lobby-panel" id="lobby-invited" hidden>
      <p class="invited-head">対戦に招待されました</p>
      <p class="invited-code">部屋 <strong id="invited-code"></strong></p>
      <label class="field">
        <span class="field-label">あなたの名前</span>
        <input id="invited-name" type="text" maxlength="16" placeholder="例：ボブ" autocomplete="nickname" enterkeyhint="go">
      </label>
      <button class="btn btn-primary btn-block" id="invited-join-btn" type="button">参加する</button>
      <p class="form-error" id="invited-error" role="alert" hidden></p>
      <button class="btn-link" id="invited-cancel" type="button">自分で部屋を作る</button>
    </div>

    <div class="lobby-foot">
      <button class="btn-link" type="button" data-open-rules>ルールを見る</button>
      <span>原作 ライナー・クニツィア ・ 非公式のファンメイド版</span>
    </div>
  </section>

  <!-- 相手待ち -->
  <section id="screen-wait" class="screen screen-title" hidden>
    <div class="panel wait-panel">
      <div class="wait-duel" id="wait-duel"></div>
      <h2 class="wait-title">相手を待っています<span class="dots"><i>.</i><i>.</i><i>.</i></span></h2>
      <p class="wait-code-label">部屋コード</p>
      <p class="wait-code" id="wait-code">-----</p>
      <div class="invite">
        <input id="invite-url" type="text" readonly aria-label="招待URL">
        <button class="btn btn-primary" id="copy-btn" type="button">URLをコピー</button>
      </div>
      <button class="btn btn-secondary btn-block" id="share-btn" type="button" hidden>友だちに送る</button>
      <p class="wait-hint">このURLを開いた人と対戦が始まります。</p>
    </div>
  </section>

  <!-- 対戦 -->
  <section id="screen-game" class="screen screen-game" hidden>
    <header class="topbar">
      <div class="brand" aria-hidden="true">
        <span class="brand-mascot" id="brand-mascot"></span>
        <span class="brand-text"><b>EN GARDE</b><small>オンライン対戦</small></span>
      </div>
      <div class="scoreboard" id="scoreboard">
        <div class="score-side p0"><span class="score-name" id="name-0"></span><span class="pips" id="pips-0"></span></div>
        <span class="score-vs">VS</span>
        <div class="score-side p1"><span class="pips" id="pips-1"></span><span class="score-name" id="name-1"></span></div>
      </div>
      <button class="icon-btn" type="button" data-open-rules aria-label="ルール">?</button>
    </header>

    <p class="presence" id="presence" hidden></p>

    <div class="headline">
      <span class="round-badge" id="round-badge">1</span>
      <div class="headline-text">
        <h1 id="turn-title">準備中</h1>
        <p id="turn-sub" aria-live="polite"></p>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="piste" id="piste">
        <div class="bracket" id="bracket"><span class="bracket-pill" id="bracket-pill">距離</span></div>
        <div class="tiles" id="tiles"></div>
        <div class="numbers" id="numbers"></div>
        <div class="fx" id="fx"></div>
      </div>
    </div>

    <div class="table" id="table">
      <div class="hand-zone" id="zone-0">
        <div class="hand" id="hand-0"></div>
        <span class="zone-label" id="label-0"></span>
      </div>
      <div class="piles">
        <div class="pile">
          <div class="card back pile-card" id="deck-card"><span class="deck-count" id="deck-count">15</span></div>
          <span class="zone-label neutral">山札</span>
        </div>
        <div class="pile">
          <div id="discard-card"></div>
          <span class="zone-label neutral">捨て札</span>
        </div>
      </div>
      <div class="hand-zone" id="zone-1">
        <div class="hand" id="hand-1"></div>
        <span class="zone-label" id="label-1"></span>
      </div>
    </div>

    <div class="actions" id="actions">
      <button class="btn btn-move" id="move-left" type="button" disabled></button>
      <button class="btn btn-attack" id="attack-btn" type="button" disabled>攻撃</button>
      <button class="btn btn-move" id="move-right" type="button" disabled></button>
    </div>

    <details class="log" id="log-box">
      <summary>これまでの流れ</summary>
      <ol id="log"></ol>
    </details>
  </section>

  <div class="modal-root" id="modal-root" hidden>
    <div class="modal panel" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
